name: 功能建议
description: 提议符合本地优先原则的新功能或改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: 用户场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    attributes:
      label: 数据、权限与隐私影响
      description: 是否新增字段、文件、权限、网络请求、迁移或备份格式变化？
    validations:
      required: true
  - type: textarea
    attributes:
      label: 可选替代方案
